<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 7</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
        <label for="firstname"> First Name: </label><br>
        <input type="text" id="firstname" name="firstname" value="John" readonly><br><br>
        <label for="lastname"> Last Name: </label><br>
        <input type="text" id="lastname" name="lastname" value="Smith" disabled><br><br>
        <label for="email"> Email: </label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="password"> Password: </label><br>
        <input type="password" id="password" name="password" size="40"><br><br>
        <label> Gender: </label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female:</label><br>
        <label>Hobbies:</label><br><br>
        <input type="checkbox" id="gamming" name="gamming" value="Gamming">
        <label for="gamming">Gamming</label><br>
        <input type="checkbox" id="football" name="football" value="Football">
        <label for="football">Football</label><br>
        <input type="checkbox" id="swimming" name="swimming" value="Swimming">
        <label for="swimming">Swimming</label><br>
        <br>
        <select name="pet" id="pet">
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
            <option value="Parrot">Parrot</option>
        </select><br><br>
        <textarea name="message" rows="10" cols="20" maxlength="50"></textarea><br><br>
        <input type="submit" id="submit" name="submit"><br>
        </fieldset>
        


    </form>
    
</body>
</html>
